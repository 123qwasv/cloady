
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>秋意浓 · 丰收季</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    font-family: "Microsoft YaHei", sans-serif;
    background: linear-gradient(#75bce5, #d9e8c4 65%, #e9b95d);
    height: 100vh;
}

.scene {
    height: 100vh;
    position: relative;
    overflow: hidden;
}

/* 天空 */
.sky {
    position: absolute;
    inset: 0;
    background: linear-gradient(
        to bottom,
        #69b5e8 0%,
        #b6d9e9 55%,
        #f4d89b 100%
    );
}

/* 太阳 */
.sun {
    position: absolute;
    top: 12%;
    right: 18%;
    width: 100px;
    height: 100px;
    background: #ffe9a0;
    border-radius: 50%;
    box-shadow: 0 0 70px #ffe5a0;
}

/* 云朵 */
.cloud {
    position: absolute;
    top: 15%;
    left: -200px;
    width: 140px;
    height: 45px;
    background: #fff;
    border-radius: 50px;
    opacity: .8;
    animation: cloud 35s linear infinite;
}

.cloud:before,
.cloud:after {
    content: "";
    position: absolute;
    background: white;
    border-radius: 50%;
}

.cloud:before {
    width: 65px;
    height: 65px;
    top: -30px;
    left: 25px;
}

.cloud:after {
    width: 55px;
    height: 55px;
    top: -20px;
    right: 20px;
}

@keyframes cloud {
    to { transform: translateX(130vw); }
}

/* 远山 */
.mountain {
    position: absolute;
    bottom: 25%;
    width: 100%;
    height: 45%;
    background: #a6a96c;
    clip-path: polygon(
        0 70%, 15% 30%, 30% 65%,
        48% 10%, 65% 65%, 80% 25%,
        100% 70%, 100% 100%, 0 100%
    );
}

.mountain.back {
    bottom: 30%;
    background: #809a69;
    transform: scale(1.1);
    opacity: .7;
}

/* 树林 */
.forest {
    position: absolute;
    bottom: 23%;
    width: 100%;
    height: 30%;
    display: flex;
    align-items: end;
    justify-content: space-around;
}

.tree {
    width: 0;
    height: 0;
    border-left: 28px solid transparent;
    border-right: 28px solid transparent;
    border-bottom: 110px solid #a53c28;
    filter: drop-shadow(5px 5px 2px #81522c);
}

.tree:nth-child(2n) {
    border-bottom-color: #d66a27;
    transform: scale(1.3);
}

.tree:nth-child(3n) {
    border-bottom-color: #b64c21;
    transform: scale(.85);
}

/* 金色稻田 */
.field {
    position: absolute;
    bottom: 0;
    height: 34%;
    width: 100%;
    background: linear-gradient(
        to bottom,
        #e6b84b,
        #c58b27
    );
}

.rice {
    position: absolute;
    bottom: 10%;
    width: 3px;
    height: 100px;
    background: #8e732e;
    transform-origin: bottom;
    animation: sway 2.5s ease-in-out infinite alternate;
}

.rice:before {
    content: "";
    position: absolute;
    top: 0;
    left: -7px;
    width: 17px;
    height: 40px;
    background: #f7d45f;
    border-radius: 80% 0 80% 0;
}

@keyframes sway {
    from { transform: rotate(-7deg); }
    to { transform: rotate(9deg); }
}

/* 标题 */
.content {
    position: absolute;
    top: 30%;
    width: 100%;
    text-align: center;
    color: #fff;
    text-shadow: 2px 3px 8px #75452c;
    z-index: 5;
    padding: 20px;
}

.content h1 {
    font-size: clamp(38px, 7vw, 76px);
    letter-spacing: 14px;
    animation: fadeIn 3s ease;
}

.content p {
    margin-top: 25px;
    font-size: clamp(15px, 2vw, 23px);
    letter-spacing: 5px;
    animation: fadeIn 4s ease;
}

.content .sub {
    margin-top: 35px;
    font-size: 16px;
    letter-spacing: 3px;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(25px); }
    to { opacity: 1; transform: translateY(0); }
}

/* 飘落的枫叶 */
.leaf {
    position: absolute;
    top: -40px;
    color: #b52e19;
    font-size: 27px;
    animation: fall linear infinite;
    z-index: 10;
}

@keyframes fall {
    0% {
        transform: translateY(-50px) rotate(0deg);
        opacity: 0;
    }
    10% { opacity: 1; }
    100% {
        transform: translateY(110vh) rotate(720deg);
        opacity: .7;
    }
}

/* 底部文字 */
.footer {
    position: absolute;
    bottom: 20px;
    width: 100%;
    text-align: center;
    color: #fff5d8;
    font-size: 14px;
    letter-spacing: 4px;
    text-shadow: 1px 2px 4px #81552b;
    z-index: 6;
}
</style>
</head>

<body>
<div class="scene">
    <div class="sky"></div>
    <div class="sun"></div>
    <div class="cloud"></div>

    <div class="mountain back"></div>
    <div class="mountain"></div>

    <div class="forest">
        <div class="tree"></div>
        <div class="tree"></div>
        <div class="tree"></div>
        <div class="tree"></div>
        <div class="tree"></div>
        <div class="tree"></div>
        <div class="tree"></div>
        <div class="tree"></div>
    </div>

    <div class="field" id="field"></div>

    <div class="content">
        <h1>秋 意 浓</h1>
        <p>秋高气爽 · 层林尽染 · 五谷丰登</p>
        <div class="sub">
            秋天的落叶红了，满山便也弥漫着秋天的感觉。<br><br>
            沉甸甸的稻田，迎来了收割的笑脸。<br><br>
            这是大地的馈赠，也是人们丰收的希望。
        </div>
    </div>

    <div class="footer">
        金秋时节 · 岁月丰盈
    </div>
</div>

<script>
// 创建稻穗
const field = document.getElementById("field");

for (let i = 0; i < 100; i++) {
    const rice = document.createElement("div");
    rice.className = "rice";
    rice.style.left = Math.random() * 100 + "%";
    rice.style.height = (60 + Math.random() * 100) + "px";
    rice.style.animationDelay = Math.random() * 3 + "s";
    field.appendChild(rice);
}

// 创建飘落的红叶
for (let i = 0; i < 35; i++) {
    const leaf = document.createElement("div");
    leaf.className = "leaf";
    leaf.innerHTML = "🍁";
    leaf.style.left = Math.random() * 100 + "%";
    leaf.style.animationDuration = (5 + Math.random() * 9) + "s";
    leaf.style.animationDelay = Math.random() * 10 + "s";
    leaf.style.fontSize = (16 + Math.random() * 22) + "px";
    document.querySelector(".scene").appendChild(leaf);
}
</script>
</body>
</html>
